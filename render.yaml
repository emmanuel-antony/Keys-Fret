services:
  - type: web
    name: music-ir-backend
    env: python
    buildCommand: "cd backend && bash render-build.sh"
    startCommand: "cd backend && gunicorn main:app -w 4 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: FFMPEG_LOCATION
        value: "/opt/render/project/src/backend/ffmpeg/ffmpeg"
      - key: FRONTEND_URL
        # Replace this with your actual deployed frontend URL (e.g. from Vercel)
        value: "https://keys-fret.vercel.app/"
      - key: GENERATIVE_ENGINE_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: "https://openai.generative.engine.capgemini.com/v1"
